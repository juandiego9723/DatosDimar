<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1,no-cache, no-store, must-revalidate"
				http-equiv="X-UA-Conpatible, Cache-Control" />
		</h:head>
		<h:body>

			<h:form id="formListado">
<!--             <f:event type="postAddToView" listener="#{conjuntoDatosProcesoCargaBean.reloadpage()}"/> -->
				<p:messages id="messages" showDetail="false" autoUpdate="true"
					closable="true" />
				<h2 >DESCARGAR LOS CONJUNTOS DE DATOS
					CONSULTADOS</h2>
				<p:separator />
				<p:outputLabel
					value="Señor Usuario: A continuación se muestran los conjuntos de Datos que Usted seleccionó para  comprar y posteriormente, descargar. Por favor diligencie el formulario de Solicitud. Podrá dar clic en Descargar PDF con los términos y condiciones de la Licencia de Uso de los datos solicitados." />
				<p:separator />

				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					widgetVar="dtWidgetVar" rows="10" var="datosSolicitados"
					value="#{conjuntoDatosProcesoCargaBean.listaCon}"
					selection="#{conjuntoDatosProcesoCargaBean.listaSel}"
					resizableColumns="false"
                    styleClass="wrap"
					rowKey="#{datosSolicitados.id}" emptyMessage="No existen registros">
					<p:ajax event="rowSelect" update=":formListado:tabla"/>
					<p:ajax event="rowSelectCheckbox" update=":formListado:tabla"/>
					<p:ajax event="rowUnselectCheckbox" update=":formListado:tabla"/>
					<p:ajax event="toggleSelect" update=":formListado:tabla"/>
					<p:column selectionMode="multiple"
						style="width:25px;text-align:center" />
					<p:column headerText="ID">
						<h:outputText value="#{datosSolicitados.id}" />
					</p:column>
					<p:column headerText="Conjunto">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.id}" />
					</p:column>
						<p:column headerText="Latitud">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.ylocation}" />
					</p:column>
					<p:column headerText="Longuitud">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.xlocation}" />
					</p:column>
					<p:column headerText="Originador del Dato">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.originadorDatoId}" />
					</p:column>
					<p:column headerText="Variable" style="width:280px" >
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.oidVariable}" />
					</p:column>
					<p:column headerText="Fecha Inicial">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechaini}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Fecha Final">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechafin}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Cantidad Datos">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.cantidadDatos}" >
							<f:convertNumber maxFractionDigits="2" locale="en_US"/>
					  </h:outputText>
					</p:column>
					<p:column headerText="Valor" style="width:100px">
						<h:outputText
							value="#{conjuntoDatosProcesoCargaBean.UVT * datosSolicitados.conjuntoDatosProcesoCargaId.tarifaDatosId.tarifaUnidadUvt}">
							<f:convertNumber currencySymbol="$" groupingUsed="true" maxFractionDigits="2" type="currency" locale="en_US"/>
						</h:outputText>
					</p:column>
					<p:column headerText="DESCARGAR" style="text-align: center">
						<p:commandButton icon="pi pi-arrow-down" title="Descargar"
							disabled="#{datosSolicitados.solicitudEstadoId.id != 1}"
							actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoSolicitarsel').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="ELIMINAR" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
						actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoEliminarsel').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
								value="#{datosSolicitados}" />
						</p:commandButton>
					</p:column>
					<p:columnGroup   type="footer"
					rendered="#{conjuntoDatosProcesoCargaBean.listaSel.size() gt 1}" >
    <p:row id="columfooter">
    
      <p:column colspan="11" style="text-align:right" footerText="procesar #{conjuntoDatosProcesoCargaBean.listaSel.size()} registros"/>

					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="pi pi-arrow-down" title="Descargar"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}"
                            oncomplete="PF('dialogoSolicitar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
						</f:facet>
					</p:column>
					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}" 
							oncomplete="PF('dialogoEliminar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />

						</p:commandButton>
						</f:facet>
					</p:column>


    </p:row>
</p:columnGroup>

				</p:dataTable>
				<h:panelGrid id="containerGrid" columns="1" cellpadding="10"
					width="100%">
					<p:panelGrid columns="2" cellpadding="10" style="float: right;">
						<p:commandButton id="btn_cr" value="Volver" ajax="false"
							style="width: auto; float: right;"
							actionListener="#{conjuntoDatosProcesoCargaBean.redireccionar('https://cecoldo.dimar.mil.co/datosDimar/sigSDGOConDatos/index.xhtml')}">
						</p:commandButton>
					</p:panelGrid>
				</h:panelGrid>
			</h:form>

			<h:form id="formSolicitar">
				<p:dialog id="dlgSolicitar"
					header="Descargar este conjunto de datos"
					widgetVar="dialogoSolicitar" resizable="true" height="500px"
					width="950px" showEffect="fade" hideEffect="explode" modal="true"
					left="200px" top="100px">
					<p:panel height="80%" width="80%">
						<p:panelGrid columns="1" style="margin: 0 auto;">
							<p:outputLabel
								value="La Dirección General Marítima (Dimar) le hará entrega de los siguientes datos e información, respondiendo a la solicitud recibida mediante la página de Datos Oceanográficos. Los datos e información serán compartidos a través de correo electrónico, posterior a la entrega del presente acuerdo debidamente diligenciado y firmado." />
						</p:panelGrid>
						<p:panel>
							<div align="center">
								<p:spacer height="10" />
								<ui:include src="licenciaSolicitudVenta.xhtml" />
							</div>
						</p:panel>
						<p:panelGrid columns="1">
							<p:outputLabel
								value="Se actualizará el estado de la solicitud a Pendiente por Descarga. Puede verificar la licencia, descargando el PDF de la misma en el botón Descargar Licencia." />
						</p:panelGrid>
						<p:panel>

							<h:panelGrid columns="1">
								<p:panel>
									<p:selectBooleanCheckbox
										value="#{conjuntoDatosProcesoCargaBean.checkTerminoscompra}"
										itemLabel="Acepto términos y condiciones"
										validator="#{conjuntoDatosProcesoCargaBean.checkBoxTerminos}">
										<p:ajax update="formSolicitar:solConjuntos" />
									</p:selectBooleanCheckbox>

									<h:form>
										<h:outputLink
											value="https://www.dimar.mil.co/sites/default/files/informes/Avisodeprivacidad.pdf"
											target="_blank">Ver</h:outputLink>
									</h:form>
								</p:panel>
								<p:panel>
									<p:selectBooleanCheckbox
										value="#{conjuntoDatosProcesoCargaBean.checkDatoscompra}"
										itemLabel="Acepto política de tratamiento de datos personales"
										validator="#{conjuntoDatosProcesoCargaBean.checkBoxDatos}">
										<p:ajax update="formSolicitar:solConjuntos" />
									</p:selectBooleanCheckbox>
									<h:outputLink
												value="https://www.dimar.mil.co/sites/default/files/informes/A3-00-POL-002%20Tratamiento%20de%20Datos%20Peronales%20v1.pdf"
												target="_blank">Ver</h:outputLink>
								</p:panel>
								<p:panel>
									<p:selectBooleanCheckbox
										value="#{conjuntoDatosProcesoCargaBean.checkLicenciacompra}"
										itemLabel="Acepto licencia de uso de los datos solicitados"
										validator="#{conjuntoDatosProcesoCargaBean.checkBoxLicencia}">
										<p:ajax update="formSolicitar:solConjuntos" />
									</p:selectBooleanCheckbox>
								</p:panel>

							</h:panelGrid>
						</p:panel>
						<p:commandButton value="Aceptar Licencia" id="solConjuntos"
							actionListener="#{conjuntoDatosProcesoCargaBean.solicitarConjuntoVentaCA()}"
							disabled="#{conjuntoDatosProcesoCargaBean.checkTerminoscompra eq false or conjuntoDatosProcesoCargaBean.checkDatoscompra eq false or conjuntoDatosProcesoCargaBean.checkLicenciacompra eq false}"
							update=":formListado:tabla"
							oncomplete="PF('dialogoSolicitar').hide(); PF('dtWidgetVar').unselectAllRows();" />
						<p:commandButton
							action="#{conjuntoDatosProcesoCargaBean.imprimirAceptacionVenta}"
							value="Generar PDF de la Licencia" icon="icon-report" ajax="false"></p:commandButton>
						<p:commandButton value="Cancelar"
							onclick="PF('dialogoSolicitar').hide();" />
					</p:panel>
				</p:dialog>
				<p:draggable for="dlgSolicitar" />
			</h:form>

			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="Eliminar conjunto de datos"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">

					<h:outputText value="Desea eliminar este conjunto de datos ?" />
					<p:commandButton value="Si"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosConsultadosVenta()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>
			
			
           <h:form id="formSolicitarsel">
				<p:dialog id="dlgSolicitarsel"
					header="Solicitar este conjunto de datos"
					widgetVar="dialogoSolicitarsel" resizable="true" height="500px"
					width="950px" showEffect="fade" hideEffect="explode" modal="true"
					left="200px" top="100px">
					<p:panel height="80%" width="80%">
						<p:panelGrid columns="1" style="margin: 0 auto;">
							<p:outputLabel
								value="La Dirección General Marítima (Dimar) le hará entrega de los siguientes datos e información, respondiendo a la solicitud recibida mediante la página de Datos Oceanográficos. Los datos e información serán compartidos a través de correo electrónico, posterior a la entrega del presente acuerdo debidamente diligenciado y firmado." />
						</p:panelGrid>
						<p:panel>
							<div align="center">
								<p:spacer height="10" />
								<ui:include src="licenciaSolicitudVenta.xhtml" />
							</div>
						</p:panel>
						<p:panelGrid columns="1">
							<p:outputLabel
								value="Se actualizará el estado de la solicitud a Pendiente por Descarga. Puede verificar la licencia, descargando el PDF de la misma en el botón Descargar Licencia." />
						</p:panelGrid>
						<p:panel>

							<h:panelGrid columns="1">
								<p:panel>
									<p:selectBooleanCheckbox
										value="#{conjuntoDatosProcesoCargaBean.checkTerminoscomprasel}"
										itemLabel="Acepto términos y condiciones"
										validator="#{conjuntoDatosProcesoCargaBean.checkBoxTerminos}">
										<p:ajax update="formSolicitar:solConjuntos" />
									</p:selectBooleanCheckbox>

									<h:form>
										<h:outputLink
											value="https://www.dimar.mil.co/sites/default/files/informes/Avisodeprivacidad.pdf"
											target="_blank">Ver</h:outputLink>
									</h:form>
								</p:panel>
								<p:panel>
									<p:selectBooleanCheckbox
										value="#{conjuntoDatosProcesoCargaBean.checkDatoscomprasel}"
										itemLabel="Acepto política de tratamiento de datos personales"
										validator="#{conjuntoDatosProcesoCargaBean.checkBoxDatos}">
										<p:ajax update="formSolicitar:solConjuntos" />
									</p:selectBooleanCheckbox>
									<h:outputLink
												value="https://www.dimar.mil.co/sites/default/files/informes/A3-00-POL-002%20Tratamiento%20de%20Datos%20Peronales%20v1.pdf"
												target="_blank">Ver</h:outputLink>
								</p:panel>
								<p:panel>
									<p:selectBooleanCheckbox
										value="#{conjuntoDatosProcesoCargaBean.checkLicenciacomprasel}"
										itemLabel="Acepto licencia de uso de los datos solicitados"
										validator="#{conjuntoDatosProcesoCargaBean.checkBoxLicencia}">
										<p:ajax update="formSolicitar:solConjuntos" />
									</p:selectBooleanCheckbox>
								</p:panel>

							</h:panelGrid>
						</p:panel>
						<p:commandButton value="Aceptar Licencia" id="solConjuntos"
							actionListener="#{conjuntoDatosProcesoCargaBean.solicitarConjuntoVentaCAID(conjuntoDatosProcesoCargaBean.datosol)}"
							update=":formListado:tabla"
							oncomplete="PF('dialogoSolicitarsel').hide(); PF('dtWidgetVar').unselectAllRows();" />
						<p:commandButton
							action="#{conjuntoDatosProcesoCargaBean.imprimirAceptacionVenta}"
							value="Generar PDF de la Licencia" icon="icon-report" ajax="false"></p:commandButton>
						<p:commandButton value="Cancelar"
							onclick="PF('dialogoSolicitarsel').hide();" />
					</p:panel>
				</p:dialog>
				<p:draggable for="dlgSolicitarsel" />
			</h:form>

			<h:form id="formEliminarsel">
				<p:dialog id="dlgEliminarsel" header="Eliminar conjunto de datos"
					widgetVar="dialogoEliminarsel" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">

					<h:outputText value="Desea eliminar este conjunto de datos ?" />
					<p:commandButton value="Si"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosConsultadosVentaID(conjuntoDatosProcesoCargaBean.datosol)}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminarsel').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminarsel').hide();" />
				</p:dialog>
			</h:form>			
		</h:body>

	</ui:define>
</ui:composition>
