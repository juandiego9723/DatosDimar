<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
			<meta http-equiv="Cache-Control"
				content="no-cache, no-store, must-revalidate" />
			<meta http-equiv="Pragma" content="no-cache" />
			<meta http-equiv="Expires" content="0" />
		</h:head>
		<h:body>

			<h:form id="formListado">
<!-- 			<f:event type="postAddToView" listener="#{conjuntoDatosProcesoCargaBean.reloadpage()}"/> -->
				<p:messages id="messages" showDetail="false" autoUpdate="true"
					closable="true" />
				<h2 >ESTADOS EN QUE SE ENCUENTRAN LOS
					CONJUNTOS DE DATOS QUE HA SOLICITADO</h2>
				<p:separator />
				<p:outputLabel
					value="Señor Usuario: A continuación se muestran los conjuntos de Datos que Usted seleccionó para la Compra / Descarga." />
				<p:separator />
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					widgetVar="dtWidgetVar" rows="10" var="datosSolicitados"
					value="#{conjuntoDatosProcesoCargaBean.listaSel}"
					selection="#{conjuntoDatosProcesoCargaBean.solicitudesSel}"
					resizableColumns="false"
                    styleClass="wrap"
					rowKey="#{datosSolicitados.id}" emptyMessage="No existen registros">
					
					<p:ajax event="rowSelect" update=":formListado:tabla"/>
					<p:ajax event="rowSelectCheckbox" update=":formListado:tabla"/>
					<p:ajax event="rowUnselectCheckbox" update=":formListado:tabla"/>
					<p:ajax event="toggleSelect" update=":formListado:tabla"/>
					<p:column selectionMode="multiple"
						style="width:16px;text-align:center" />
					<p:column headerText="ID">
						<h:outputText value="#{datosSolicitados.id}" />
					</p:column>
					<p:column headerText="Conjunto">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.id}" />
					</p:column>
					<p:column headerText="Tipo Dato">
						<h:outputText value="#{datosSolicitados.tipoDatoId.nombre}" />
					</p:column>
					<p:column headerText="Tipo Conjunto">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.tipoConjuntoDatosId.nombre}" />
					</p:column>
					<p:column headerText="Originador del Dato">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.originadorDatoId}" />
					</p:column>
					<p:column headerText="Variable" style="width:280px">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.oidVariable}" />
					</p:column>
					<p:column headerText="Fecha Inicial">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechaini}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Fecha Final">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechafin}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Cantidad Datos">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.cantidadDatos}" >
							<f:convertNumber maxFractionDigits="2" locale="en_US"/>
					    </h:outputText>
					</p:column>
					<p:column headerText="Valor" style="width:100px">
						<h:outputText
							value="#{conjuntoDatosProcesoCargaBean.UVT  * datosSolicitados.conjuntoDatosProcesoCargaId.tarifaDatosId.tarifaUnidadUvt}">
							<f:convertNumber currencySymbol="$" groupingUsed="true" maxFractionDigits="2" type="currency" locale="en_US"/>
						</h:outputText>
					</p:column>
<!-- 					<p:column headerText="ACEPTAR LICENCIA" style="text-align: center"> -->
<!-- 						<p:commandButton icon="ui-icon-print" title="Aceptar Licencia" -->
<!-- 							disabled="#{datosSolicitados.solicitudEstadoId.id != 2}" -->
<!-- 							actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}" -->
<!-- 							oncomplete="PF('dialogoLicenciadatosel').show();"> -->
<!-- 							<f:setPropertyActionListener -->
<!-- 								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}" -->
<!-- 								value="#{conjuntoDatosProcesoCarga}" /> -->
<!-- 						</p:commandButton> -->
<!-- 					</p:column> -->
					<p:column headerText="COMPRAR" style="text-align: center">
						<p:commandButton icon="ui-icon-cart" title="Comprar"
							disabled="#{datosSolicitados.solicitudEstadoId.id != 3}"
							actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoComprardatosel').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="DESCARGAR" style="text-align: center">
						<p:commandButton icon="ui-icon-circle-arrow-s" title="Descargar"
							disabled="#{datosSolicitados.solicitudEstadoId.id != 4}"
							actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoDescargardatosel').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="ELIMINAR" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
						actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoEliminardatosel').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
								value="#{datosSolicitados}" />
						</p:commandButton>
					</p:column>
					
					
					<p:columnGroup   type="footer"
					rendered="#{conjuntoDatosProcesoCargaBean.solicitudesSel.size() gt 1}" >
    <p:row id="columfooter">
    
      <p:column colspan="11" style="text-align:right" footerText="procesar #{conjuntoDatosProcesoCargaBean.solicitudesSel.size()} registros"/>

					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="ui-icon-cart" title="Comprar"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}"
                            oncomplete="PF('dialogoComprar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
						</f:facet>
					</p:column>
					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="ui-icon-circle-arrow-s" title="Descargar"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}" 
							oncomplete="PF('dialogoDescargar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />

						</p:commandButton>
						</f:facet>
					</p:column>
					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}" 
							oncomplete="PF('dialogoEliminar').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
								value="#{datosSolicitados}" />

						</p:commandButton>
						</f:facet>
					</p:column>	

    </p:row>
</p:columnGroup>

				</p:dataTable>
				<h:panelGrid id="containerGrid" columns="1" cellpadding="10"
					width="100%">
					<p:panelGrid columns="2" cellpadding="10" style="float: right;">
						<p:commandButton id="btn_cr" value="Volver" ajax="false"
							style="width: auto; float: right;"
							action="/pages/administracion/panelAdministracion.xhtml?faces-redirect=true">
						</p:commandButton>
					</p:panelGrid>
				</h:panelGrid>
			</h:form>

			<h:form id="formSolicitar">
				<p:dialog id="dlgSolicitar"
					header="Descargar este conjunto de datos"
					widgetVar="dialogoSolicitar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel
							value="Se actualizará el estado de la solicitud a Pendiente por Licencia" />
					</p:panelGrid>

					<p:commandButton value="Solicitar"
						actionListener="#{conjuntoDatosProcesoCargaBean.solicitarConjuntoVenta()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoSolicitar').hide(); PF('dtWidgetVar').unselectAllRows();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoSolicitar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formLicencia">
				<p:dialog id="dlgLicencia" header="Aceptar la Licencia de uso"
					widgetVar="dialogoLicencia" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true" width="620" height="600"
					closeOnEscape="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel
							value="La Dirección General Marítima (Dimar) hace entrega de los siguientes datos e información, respondiendo a la solicitud recibida mediante la página de Datos Oceanográficos. Los datos e información serán compartidos a través de correo electrónico, posterior a la entrega del presente acuerdo debidamente diligenciado y firmado." />
					</p:panelGrid>
					<p:commandButton value="Aceptar Licencia"
						actionListener="#{conjuntoDatosProcesoCargaBean.aceptarLicenciaVentaCA()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoLicencia').hide(); PF('dtWidgetVar').unselectAllRows();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoLicencia').hide();" />
				</p:dialog>
			</h:form>
				<h:form id="formLicenciadatosel">
				<p:dialog id="dlgLicenciadatosel" header="Aceptar la Licencia de uso"
					widgetVar="dialogoLicenciadatosel" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true" width="620" height="600"
					closeOnEscape="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel
							value="La Dirección General Marítima (Dimar) hace entrega de los siguientes datos e información, respondiendo a la solicitud recibida mediante la página de Datos Oceanográficos. Los datos e información serán compartidos a través de correo electrónico, posterior a la entrega del presente acuerdo debidamente diligenciado y firmado." />
					</p:panelGrid>
					<p:commandButton value="Aceptar Licencia"
						actionListener="#{conjuntoDatosProcesoCargaBean.aceptarLicenciaVentaCAID(conjuntoDatosProcesoCargaBean.datosol)}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoLicenciadatosel').hide(); PF('dtWidgetVar').unselectAllRows();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoLicenciadatosel').hide();" />
				</p:dialog>
			</h:form>
			
			<h:form id="formComprar">
				<p:dialog id="dlgComprar"
					header="Comprar conjunto de datos seleccionados"
					widgetVar="dialogoComprar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel value="Se dirigirá a la pasarela de pagos" />
					</p:panelGrid>
					<p:commandButton value="Comprar"
						actionListener="#{conjuntoDatosProcesoCargaBean.comprarConjunto()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoComprar').hide(); PF('dtWidgetVar').unselectAllRows();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoComprar').hide();" />
				</p:dialog>
			</h:form>
			<h:form id="formComprardatosel">
				<p:dialog id="dlgComprardatosel"
					header="Comprar conjunto de datos seleccionados"
					widgetVar="dialogoComprardatosel" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel value="Se dirigirá a la pasarela de pagos" />
					</p:panelGrid>
					<p:commandButton value="Comprar"
						actionListener="#{conjuntoDatosProcesoCargaBean.comprarConjuntoID(conjuntoDatosProcesoCargaBean.datosol)}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoComprardatosel').hide(); PF('dtWidgetVar').unselectAllRows();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoComprardatosel').hide();" />
				</p:dialog>
			</h:form>
			
			<h:form id="formDescargar">
				<p:dialog id="dlgDescargar"
					header="Descargar conjunto de datos seleccionados"
					widgetVar="dialogoDescargar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel
							value="Se descargarán los archivos de la información seleccionada" />
					</p:panelGrid>
					<p:commandButton value="Descargar" type="submit" process="@this" ajax="false"
						actionListener="#{conjuntoDatosProcesoCargaBean.descargaZipVenta()}"					
						update=":formListado:tabla"
						oncomplete="PF('dialogoDescargar').hide(); PF('dtWidgetVar').unselectAllRows();">
						<p:fileDownload value="#{conjuntoDatosProcesoCargaBean.filedescargazip}" />
						</p:commandButton>
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoDescargar').hide();" />
				</p:dialog>
			</h:form>
			
			<h:form id="formDescargardatosel">
				<p:dialog id="dlgDescargardatosel"
					header="Descargar conjunto de datos seleccionados"
					widgetVar="dialogoDescargardatosel" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="1" style="margin: 0 auto;">
						<p:outputLabel
							value="Se descargarán los archivos de la información seleccionada" />
					</p:panelGrid>
					<p:commandButton value="Descargar" type="submit" process="@this" ajax="false"
						actionListener="#{conjuntoDatosProcesoCargaBean.descargaZipVentaID(conjuntoDatosProcesoCargaBean.datosol)}"					
						update=":formListado:tabla"
						oncomplete="PF('dialogoDescargardatosel').hide(); PF('dtWidgetVar').unselectAllRows();">
						<p:fileDownload value="#{conjuntoDatosProcesoCargaBean.filedescargazip}" />
						</p:commandButton>
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoDescargardatosel').hide();" />
				</p:dialog>
			</h:form>
			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="Eliminar conjunto de datos"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<h:outputText value="Desea eliminar este conjunto de datos ?" />
					<p:commandButton value="Si"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosSolicitadosVentaCA()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>
			
			<h:form id="formEliminardatosel">
				<p:dialog id="dlgEliminardatosel" header="Eliminar conjunto de datos"
					widgetVar="dialogoEliminardatosel" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">

					<h:outputText value="Desea eliminar este conjunto de datos ?" />
					<p:commandButton value="Si"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosSolicitadosVentaCAID(conjuntoDatosProcesoCargaBean.datosol)}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminardatosel').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminardatosel').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formSolEspecial">
				<p:panel>
					<h:outputText
						value="Desea realizar una solicitud especial de datos no encontrados ?" />
					<p:separator />
					<p:commandButton id="irSolEsp"
						value="Solicitar Datos no encontrados"
						action="#{conjuntoDatosProcesoCargaBean.solEspecial}" />
				</p:panel>
			</h:form>
		</h:body>

	</ui:define>
</ui:composition>
