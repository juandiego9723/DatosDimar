<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<p:panel header="Bienvenidos a la pasarela de Pagos de la DIMAR"
		styleClass="sub-header-panel" />
	<h:form id="formResumen">
		<p:panel style="align: right">
			<h:panelGrid id="pago" columns="2">
				<p:outputLabel for="totPagar" value="Se dispone a pagar: " />
				<p:inputText id="totPagar"
					value="#{conjuntoDatosProcesoCargaBean.totalPagar}"
					disabled="true" />
			</h:panelGrid>
		</p:panel>
	</h:form>
	<p:spacer height="10" />
</ui:composition>
