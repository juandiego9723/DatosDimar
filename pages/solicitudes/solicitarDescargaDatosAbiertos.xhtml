<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1,no-cache, no-store, must-revalidate"
				http-equiv="X-UA-Conpatible, Cache-Control" />
		</h:head>
		<h:body>
			<h:form id="formListado">
				<p:messages id="messages" showDetail="false" autoUpdate="true"
					closable="true" />
				<h2 >DESCARGAR LOS CONJUNTOS DE DATOS SOLICITADOS</h2>
				<p:separator />
				<p:outputLabel
					value="Señor Usuario: A continuación se muestran los conjuntos de Datos que Usted seleccionó. Favor aceptar la licencia para tener acceso a la Descarga." />
				<p:separator />
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					widgetVar="dtWidgetVar" rows="10" var="datosSolicitados"
					value="#{conjuntoDatosProcesoCargaBean.listaAbiertosSel}"
					selection="#{conjuntoDatosProcesoCargaBean.solicitudesSel}"
					resizableColumns="false"
                    styleClass="wrap"
					rowKey="#{datosSolicitados.id}" emptyMessage="No existen registros">
					<p:column selectionMode="multiple"
						style="width:16px;text-align:center" />
					<p:column headerText="ID">
						<h:outputText value="#{datosSolicitados.id}" />
					</p:column>
					<p:column headerText="Tipo Dato">
						<h:outputText value="#{datosSolicitados.tipoDatoId.nombre}" />
					</p:column>
					<p:column headerText="Conjunto">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.id}" />
					</p:column>
					<p:column headerText="Tipo Conjunto">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.tipoConjuntoDatosId.nombre}" />
					</p:column>
					<p:column headerText="Originador del Dato">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.originadorDatoId}" />
					</p:column>
					<p:column headerText="Variable" style="width:280px">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.oidVariable}" />
					</p:column>
					<p:column headerText="Fecha Inicial">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechaini}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Fecha Final">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechafin}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Cantidad Datos">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.cantidadDatos}" >
							<f:convertNumber maxFractionDigits="2" locale="en_US"/>
					    </h:outputText>
					</p:column>
					<p:column headerText="ACEPTAR LICENCIA" style="text-align: center">
						<p:commandButton icon="ui-icon-print" title="Aceptar Licencia"
							disabled="#{datosSolicitados.solicitudEstadoId.id != 2}"
							oncomplete="PF('dialogoLicencia').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
					</p:column>
<!-- 					<p:column headerText="DESCARGAR" style="text-align: center"> -->
<!-- 						<p:commandButton icon="ui-icon-document" title="Descargar" -->
<!-- 							target="_blank" -->
<!-- 							disabled="#{datosSolicitados.solicitudEstadoId.id != 3}" -->
<!-- 							update=":formListado:tabla, :formListado:messages" -->
<!-- 							actionListener="#{conjuntoDatosProcesoCargaBean.descargaZip()}" -->
<!-- 							oncomplete="PF('dialogoDescargar').show(); PF('dtWidgetVar').unselectAllRows();"> -->
<!-- 							<f:setPropertyActionListener -->
<!-- 								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}" -->
<!-- 								value="#{conjuntoDatosProcesoCarga}" /> -->
<!-- 						</p:commandButton> -->
<!-- 					</p:column> -->
					<p:column headerText="ELIMINAR" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
							oncomplete="PF('dialogoEliminar').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
								value="#{datosSolicitados}" />
						</p:commandButton>
					</p:column>

				</p:dataTable>
			</h:form>
			<h:form id="formDescargar">
				<p:dialog id="dlgDescargar" header="Encuesta de Satisfacción"
					widgetVar="dialogoDescargar" resizable="false" showEffect="fade"
					width="950px" hideEffect="explode" modal="true" left="200px"
					top="100px">
					<p:panel>
						<p:panelGrid columns="1" style="margin: 0 auto;">
							<p:outputLabel  style="color: red"
								value="Se ha descargado satisfactoria el archivo ZIP con los conjuntos de datos solicitados. A continuación, se solicita diligenciar una breve encuesta de satisfacción la cual nos permite seguir mejorando nuestros servicios." />
						</p:panelGrid>
						<p:panel style="float:left;overflow-y: auto;height: 100px;">
							<div align="center">
								<p:spacer height="10" />
								<ui:include src="../encuestas/encuestaSatisfaccion.xhtml" />
							</div>
						</p:panel>
						<p:commandButton value="Enviar Encuesta"
							actionListener="#{encuestaBean.enviarEncuestaSatisfaccion()}"
							update=":formListado:tabla"
							oncomplete="PF('dialogoDescargar').hide(); PF('dtWidgetVar').unselectAllRows();" />
					</p:panel>
				</p:dialog>
			</h:form>
			<h:form id="formLicencia">
				<p:dialog id="dlgLicencia" header="Aceptar la Licencia"
					widgetVar="dialogoLicencia" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true" width="950px" 
					left="200px" top="100px"
					closeOnEscape="true">
					<p:panelGrid columns="1">
						<p:outputLabel
							value="Se dispone a aceptar la licencia, de acuerdo a la información diligenciada en el paso anterior. Se enviará un correo a la cuenta registrada con el enlace de descarga, para continuar con su trámite" />
					</p:panelGrid>
					<p:commandButton value="Aceptar Licencia"
						actionListener="#{conjuntoDatosProcesoCargaBean.aceptarLicenciaDatosAbiertos()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoLicencia').hide(); PF('dtWidgetVar').unselectAllRows();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoLicencia').hide();" />
				</p:dialog>
			</h:form>
			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="Eliminar conjunto de datos"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<h:outputText
						value="Desea eliminar este conjunto de datos del listado?" />
					<p:commandButton value="Si"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosSolicitadosAbiertos()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>
		</h:body>

	</ui:define>
</ui:composition>
