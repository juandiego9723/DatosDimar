<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
		</h:head>
		<h:body>
			<h:form id="formListado">
<!-- 			<f:event type="postAddToView" listener="#{conjuntoDatosProcesoCargaBean.reloadpage()}"/> -->
				<p:messages id="msg" showDetail="false" autoUpdate="true"
					closable="true" />
				<h2 ><p:outputLabel value="#{msg['SCDA.mensaje1']}"></p:outputLabel></h2>
                     
				<p:separator />
				<p:outputLabel
					value="#{msg['SCDA.mensaje2']}" />
				<p:separator />
<!-- 				<p:outputLabel style="color: red" -->
<!-- 					value="NOTA: Antes de dar clic en SOLICITAR favor seleccionar los conjuntos deseados" /> -->
<!-- 				<p:separator /> -->
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom" 
					widgetVar="dtWidgetVar" rows="10" var="datosSolicitados"
					value="#{conjuntoDatosProcesoCargaBean.listaCon}"
					selection="#{conjuntoDatosProcesoCargaBean.listaSel}"
					resizableColumns="true"
                    styleClass="wrap"
					rowKey="#{datosSolicitados.id}" emptyMessage="#{msg['AU.mensaje1']}">
					<p:ajax event="rowSelect" update=":formListado:tabla"/>
					<p:ajax event="rowSelectCheckbox" update=":formListado:tabla"/>
					<p:ajax event="rowUnselectCheckbox" update=":formListado:tabla"/>
					<p:ajax event="toggleSelect" update=":formListado:tabla"/>
					<p:column selectionMode="multiple"
						styleClass="columselmul1" >
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje3']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.conjuntoDatosId.id}" />
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje6']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.originadorDatoId}" />
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje39']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.ylocation}" />
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje40']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.xlocation}" />
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje7']}" styleClass="columwidth">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.oidVariable}" />
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje8']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechaini}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje9']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.fechafin}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje10']}">
						<h:outputText
							value="#{datosSolicitados.conjuntoDatosProcesoCargaId.cantidadDatos}" >
							<f:convertNumber maxFractionDigits="2" locale="en_US"/>
					  </h:outputText>
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje11']}" styleClass="textalingcenter" >
						<p:commandButton icon="pi pi-arrow-down" title="#{msg['SCDA.mensaje11']}" id="btnSol"
							disabled="#{datosSolicitados.solicitudEstadoId.id != 1}"
							actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoSolicitarsel').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="#{msg['SCDA.mensaje12']}" styleClass="textalingcenter">
						<p:commandButton icon="ui-icon-trash" title="#{msg['SCDA.mensaje12']}"
						actionListener="#{conjuntoDatosProcesoCargaBean.cargaDatoseleccionado(datosSolicitados)}"
							oncomplete="PF('dialogoEliminarsel').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
								value="#{datosSolicitados}" />
						</p:commandButton>
					</p:column>
						<p:columnGroup   type="footer"
					rendered="#{conjuntoDatosProcesoCargaBean.listaSel.size() gt 1}" >
    <p:row id="columfooter">
    
      <p:column colspan="9" styleClass="textalingrigth" footerText="#{msg['SCDA.mensaje11']} #{conjuntoDatosProcesoCargaBean.listaSel.size()} #{msg['SCDA.mensaje35']}"/>

					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="pi pi-arrow-down" title="#{msg['SCDA.mensaje11']}"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}"
                            oncomplete="PF('dialogoSolicitar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />
						</p:commandButton>
						</f:facet>
					</p:column>
					<p:column >
					<f:facet name="footer">
						<p:commandButton icon="ui-icon-trash" title="#{msg['SCDA.mensaje12']}"
							disabled="#{conjuntoDatosProcesoCargaBean.listaSel.size() lt 2}" 
							oncomplete="PF('dialogoEliminar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.conjuntoDatosProcesoCarga}"
								value="#{conjuntoDatosProcesoCarga}" />

						</p:commandButton>
						</f:facet>
					</p:column>


    </p:row>
</p:columnGroup>

				</p:dataTable>
				<p:commandButton id="btndescargar" value="Descargar archivo" ajax="false"
					 target="_blank"
					disabled="#{conjuntoDatosProcesoCargaBean.descargaok eq true}">
					<p:fileDownload
						value="#{conjuntoDatosProcesoCargaBean.filedescargaabiertoszip}" />
				</p:commandButton>
				<p:commandButton id="btn_cr" value="#{msg['AU.mensaje11']}" ajax="false"
					styleClass="loginbottom"
					actionListener="#{conjuntoDatosProcesoCargaBean.redireccionar('https://cecoldo.dimar.mil.co/datosDimar/sigSDGOAbiertos/index.xhtml')}">
				</p:commandButton>
			</h:form>
			<h:form id="formSolicitar">
				<p:dialog id="dlgSolicitar" appendToBody="true"
					header="#{msg['SCDA.mensaje13']}"
					widgetVar="dialogoSolicitar" resizable="true" height="500px"
					width="950px" showEffect="fade" hideEffect="explode" modal="true"
					left="200px" top="100px">
					<p:panel height="80%" width="100%">
						<p:panelGrid columns="1">
							<p:outputLabel
								value="#{msg['SCDA.mensaje14']}" />
						</p:panelGrid>
						<p:panel>
							<div align="center">
								<p:spacer height="10" />
								<ui:include src="licenciaSolicitudAbiertos.xhtml" />
							</div>
						</p:panel>
						<p:panel>
<!-- 							<p:panelGrid columns="1"> -->
<!-- 								<p:outputLabel -->
<!-- 									value="#{msg['SCDA.mensaje27']}" /> -->
<!-- 							</p:panelGrid> -->
							<p:panel height="80%" width="100%" >

								<h:panelGrid columns="1">
									<p:panel>
										<p:selectBooleanCheckbox
											value="#{conjuntoDatosProcesoCargaBean.checkTerminos}"
											itemLabel="#{msg['SCDA.mensaje28']}"
											validator="#{conjuntoDatosProcesoCargaBean.checkBoxTerminos}">
											<p:ajax update="formSolicitar:solConjuntos" />
										</p:selectBooleanCheckbox>
											  
										<h:form>
											<h:outputLink
												value="https://www.dimar.mil.co/sites/default/files/informes/Avisodeprivacidad.pdf"
												target="_blank"><p:outputLabel value="#{msg['SCDA.mensaje29']}"></p:outputLabel></h:outputLink>
										</h:form>
									</p:panel>
<!-- 									<p:panel > -->
<!-- 										<p:selectBooleanCheckbox -->
<!-- 											value="#{conjuntoDatosProcesoCargaBean.checkDatos}" -->
<!-- 											itemLabel="#{msg['SCDA.mensaje30']}" -->
<!-- 											validator="#{conjuntoDatosProcesoCargaBean.checkBoxDatos}"> -->
<!-- 											<p:ajax update="formSolicitar:solConjuntos" /> -->
<!-- 										</p:selectBooleanCheckbox> -->
<!-- 											<h:outputLink -->
<!-- 												value="https://www.dimar.mil.co/sites/default/files/informes/A3-00-POL-002%20Tratamiento%20de%20Datos%20Peronales%20v1.pdf" -->
<!-- 												target="_blank"><p:outputLabel value="#{msg['SCDA.mensaje29']}"></p:outputLabel></h:outputLink> -->

<!-- 										</p:panel> -->
									<p:panel>
										<p:selectBooleanCheckbox
											value="#{conjuntoDatosProcesoCargaBean.checkLicencia}"
											itemLabel="#{msg['SCDA.mensaje31']}"
											validator="#{conjuntoDatosProcesoCargaBean.checkBoxLicencia}">
											<p:ajax update="formSolicitar:solConjuntos" />
										</p:selectBooleanCheckbox>
									</p:panel>

								</h:panelGrid>
							</p:panel>

							<p:commandButton value="#{msg['SCDA.mensaje32']}"
								id="solConjuntos" ajax="false"
								update=" :formListado:btndescargar"
								actionListener="#{conjuntoDatosProcesoCargaBean.solicitarConjuntoAbierto()}"
								disabled="#{conjuntoDatosProcesoCargaBean.checkTerminos eq false or conjuntoDatosProcesoCargaBean.checkDatos eq false or conjuntoDatosProcesoCargaBean.checkLicencia eq false or conjuntoDatosProcesoCargaBean.licenciaok eq true}">
							</p:commandButton>

							<p:commandButton
								action="#{conjuntoDatosProcesoCargaBean.imprimirAceptacionAbiertos}"
								value="#{msg['SCDA.mensaje33']}" icon="icon-report" ajax="false"></p:commandButton>
							<p:commandButton value="#{msg['SCDA.mensaje34']}"
								onclick="PF('dialogoSolicitar').hide();" />
		
						</p:panel>
					</p:panel>
				</p:dialog>
				<p:draggable for="dlgSolicitar" />
			</h:form>

			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="#{msg['PSDV.eliminar2']}"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">

					<h:outputText value="#{msg['PSDV.eliminar3']}" />
					<p:commandButton value="#{msg['PSDV.si']}"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosConsultadosAbiertos()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>
			
			<h:form id="formSolicitarsel">
				<p:dialog id="dlgSolicitarsel" appendToBody="true"
					header="#{msg['SCDA.mensaje13']}"
					widgetVar="dialogoSolicitarsel" resizable="true" height="500px"
					width="950px" showEffect="fade" hideEffect="explode" modal="true"
					left="200px" top="100px">
					<p:panel height="80%" width="80%">
						<p:panelGrid columns="1">
							<p:outputLabel
								value="#{msg['SCDA.mensaje14']}" />
						</p:panelGrid>
						<p:panel>
							<div align="center">
								<p:spacer height="10" />
								<ui:include src="licenciaSolicitudAbiertos.xhtml" />
							</div>
						</p:panel>
						<p:panel>
<!-- 							<p:panelGrid columns="1"> -->
<!-- 								<p:outputLabel -->
<!-- 									value="#{msg['SCDA.mensaje27']}" /> -->
<!-- 							</p:panelGrid> -->
							<p:panel>

								<h:panelGrid columns="1">
									<p:panel>
										<p:selectBooleanCheckbox
											value="#{conjuntoDatosProcesoCargaBean.checkTerminosabsel}"
											itemLabel="#{msg['SCDA.mensaje28']}"
											validator="#{conjuntoDatosProcesoCargaBean.checkBoxTerminos}">
											<p:ajax update="formSolicitarsel:solConjuntos" />
										</p:selectBooleanCheckbox>
											  
										<h:form>
											<h:outputLink
												value="https://www.dimar.mil.co/sites/default/files/informes/Avisodeprivacidad.pdf"
												target="_blank"><p:outputLabel value="#{msg['SCDA.mensaje29']}"></p:outputLabel></h:outputLink>
										</h:form>
									</p:panel>
<!-- 									<p:panel > -->
<!-- 										<p:selectBooleanCheckbox -->
<!-- 											value="#{conjuntoDatosProcesoCargaBean.checkDatosabsel}" -->
<!-- 											itemLabel="#{msg['SCDA.mensaje30']}" -->
<!-- 											validator="#{conjuntoDatosProcesoCargaBean.checkBoxDatos}"> -->
<!-- 											<p:ajax update="formSolicitar:solConjuntos" /> -->
<!-- 										</p:selectBooleanCheckbox> -->
<!-- 											<h:outputLink -->
<!-- 												value="https://www.dimar.mil.co/sites/default/files/informes/A3-00-POL-002%20Tratamiento%20de%20Datos%20Peronales%20v1.pdf" -->
<!-- 												target="_blank"><p:outputLabel value="#{msg['SCDA.mensaje29']}"></p:outputLabel></h:outputLink> -->

<!-- 										</p:panel> -->
									<p:panel>
										<p:selectBooleanCheckbox
											value="#{conjuntoDatosProcesoCargaBean.checkLicenciaabsel}"
											itemLabel="#{msg['SCDA.mensaje31']}"
											validator="#{conjuntoDatosProcesoCargaBean.checkBoxLicencia}">
											<p:ajax update="formSolicitarsel:solConjuntos" />
										</p:selectBooleanCheckbox>
									</p:panel>

								</h:panelGrid>
							</p:panel>

							<p:commandButton value="#{msg['SCDA.mensaje32']}" id="solConjuntos" ajax="false"
							    target="_blank"
								actionListener="#{conjuntoDatosProcesoCargaBean.solicitarConjuntoAbiertoID(conjuntoDatosProcesoCargaBean.datosol)}"
								disabled="#{conjuntoDatosProcesoCargaBean.checkTerminosabsel eq false or conjuntoDatosProcesoCargaBean.checkDatosabsel eq false or conjuntoDatosProcesoCargaBean.checkLicenciaabsel eq false}"
								update=":formListado:tabla"
								oncomplete="PF('dialogoSolicitarsel').hide(); PF('dtWidgetVar').unselectAllRows();" >
							</p:commandButton>
<!-- 							<p:commandButton -->
<!-- 								action="#{conjuntoDatosProcesoCargaBean.imprimirAceptacionAbiertos}" -->
<!-- 								value="Generar PDF de la Licencia" icon="icon-report" ajax="false"></p:commandButton> -->
							<p:commandButton value="#{msg['SCDA.mensaje34']}"
								onclick="PF('dialogoSolicitarsel').hide();" />
						</p:panel>
					</p:panel>
				</p:dialog>
				<p:draggable for="dlgSolicitarsel" />
			</h:form>

			<h:form id="formEliminarsel">
				<p:dialog id="dlgEliminarsel" header="#{msg['PSDV.eliminar2']}"
					widgetVar="dialogoEliminarsel" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">

					<h:outputText value="#{msg['PSDV.eliminar3']}" />
					<p:commandButton value="#{msg['PSDV.si']}"
						actionListener="#{conjuntoDatosProcesoCargaBean.eliminarDatosConsultadosAbiertosID(conjuntoDatosProcesoCargaBean.datosol)}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminarsel').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminarsel').hide();" />
				</p:dialog>
			</h:form>
			
		</h:body>

	</ui:define>
</ui:composition>
