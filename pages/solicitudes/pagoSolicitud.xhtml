<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
		</h:head>
		<h:body>

			<h:form id="formListado">
				<p:messages id="messages" showDetail="false" autoUpdate="true"
					closable="true" />
				<h2 >RESUMEN DE PAGO</h2>
				<p:separator />
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					widgetVar="dtWidgetVar" rows="10" var="datosSolicitados"
					value="#{conjuntoDatosProcesoCargaBean.datosvalorespagos}"
					rowKey="#{datosSolicitados.id}"
					resizableColumns="false"
                    styleClass="wrap"
					emptyMessage="No existen datos para pago">
					<p:column headerText="ID">
						<h:outputText value="#{datosSolicitados.id}" />
					</p:column>

					<p:column headerText="Variable" style="width:400px">
						<h:outputText
							value="#{datosSolicitados.variable}" />
					</p:column>

					<p:column headerText="Cantidad Datos">
						<h:outputText
							value="#{datosSolicitados.cantidaddatos}" >
							<f:convertNumber maxFractionDigits="0" locale="en_US"/>
					    </h:outputText>
					</p:column>
					<p:column headerText="Valor">
						<h:outputText
							value="#{datosSolicitados.valorunitario}">
							<f:convertNumber currencySymbol="$" groupingUsed="true" maxFractionDigits="0" type="currency" locale="en_US" />
						</h:outputText>
					</p:column>
					<p:column headerText="Tarifa UVT">
						<h:outputText
							value="#{datosSolicitados.tarUVT}">
							<f:convertNumber currencySymbol="$" groupingUsed="true" maxFractionDigits="0" type="currency" locale="en_US" />
						</h:outputText>
					</p:column>
					<p:column headerText="Tipo Tarifa">
						<h:outputText
							value="#{datosSolicitados.tarifatxt}">
						</h:outputText>
					</p:column>
					<p:column headerText="Código Prod">
						<h:outputText
							value="#{datosSolicitados.codigoprod}">
						</h:outputText>
					</p:column>

					<p:column headerText="ELIMINAR" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
							oncomplete="PF('dialogoEliminar').show();">
							<f:setPropertyActionListener
								target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
								value="#{datosSolicitados}" />
						</p:commandButton>
					</p:column>

				</p:dataTable>
				<p:panel style="align: right">
					<h:panelGrid id="pago" columns="5">
						<p:outputLabel for="totPagar" value="Total a Pagar" styleClass="p-mr-2 p-mb-2"/>
						<h:outputText value="&#160;" />
						<p:inputText id="totPagar" style="text-align: center" class="TexCenter"
							value="#{conjuntoDatosProcesoCargaBean.totalPagar}"
							disabled="true" >
							<f:convertNumber currencySymbol="$" groupingUsed="true" maxFractionDigits="2" type="currency" locale="en_US"/>	
						</p:inputText>
						<h:outputText value="&#160;" />
						<p:commandButton style="background-image: url('../../images/logoPSE.jpg'); background-size: cover; width: 150px;height: 50px;color: white;border-color: white;font-size: 15px;" title="PSE"
					actionListener="#{conjuntoDatosProcesoCargaBean.pagoPSEnewII()}">
					<f:setPropertyActionListener
						target="#{conjuntoDatosProcesoCargaBean.datosSolicitados}"
						value="#{datosSolicitados}" />
				</p:commandButton>
					</h:panelGrid>
				</p:panel>
			</h:form>
		</h:body>

	</ui:define>
</ui:composition>
