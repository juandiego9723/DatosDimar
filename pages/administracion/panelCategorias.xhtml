<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>
			<script type="text/javascript">
				function handleLoginRequest(xhr, status, args) {
					if (args.validationFailed || !args.loggedIn) {
						jQuery('#form').effect("shake", {
							times : 3
						}, 100);
					} else {
						PF('dlg').hide();
						$('#loginLink').fadeOut();
					}
				}
			</script>
			<h:form id="form">
				<h:messages id="mensaje" autoUpdate="true" />

				<p:panel header="#{msg['panelCat.modCat']}" footer=" " id="panel">

					<p:panelGrid columns="4" style="width:100%;">
						
						<p:panelGrid columns="1"
							style="width:80%; margin-left: 10%; background: #c4c4c4; text-align: center;">
							<p:commandLink id="Arcmarine"
								action="/pages/administracion/panelArcmarine.xhtml?faces-redirect=true">
								<!-- <i class="pi pi-plus-circle" style="font-size: 5rem"></i> -->
								<h:graphicImage><img src="../../images/ITablasArcMarine.svg" width="100" height="100"></img></h:graphicImage>
							</p:commandLink>
							<p:commandLink id="Arcmarine1" ajax="false" value="#{msg['panelCat.tabArc']}"
								action="/pages/administracion/panelArcmarine?faces-redirect=true">
							</p:commandLink>
						</p:panelGrid>

					<p:panelGrid columns="1"
							style="width:80%; margin-left: 10%; background: #c4c4c4; text-align: center;">
							<p:commandLink id="panelTablasReferencia"
								action="/pages/administracion/panelTablasReferencia.xhtml?faces-redirect=true">
								<!-- <i class="pi pi-plus-circle" style="font-size: 5rem"></i> -->
								<h:graphicImage><img src="../../images/ITablasReferencia.svg" width="100" height="100"></img></h:graphicImage>
							</p:commandLink>
							<p:commandLink id="panelTablasReferencia1" ajax="false" value="#{msg['panelCat.tabRef']}"
								action="/pages/administracion/panelTablasReferencia?faces-redirect=true">
							</p:commandLink>
						</p:panelGrid>
						</p:panelGrid>

					<h:panelGrid id="containerGrid" columns="1" cellpadding="10"
						width="100%">
						<p:panelGrid columns="2" cellpadding="10" style="float: right;">
							<p:commandButton id="btn_cr" value="#{msg['panelCat.volver']}" ajax="false"
								action="/pages/administracion/panelAdministracion.xhtml?faces-redirect=true">
							</p:commandButton>
						</p:panelGrid>
					</h:panelGrid>

				</p:panel>


			</h:form>
		</h:body>

	</ui:define>
</ui:composition>
