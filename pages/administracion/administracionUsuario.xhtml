<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
<!--                 <meta http-equiv="Content-Security-Policy" content="style-src 'self'  -->
<!--      gstatic.com   https://cecoldo.dimar.mil.co/datosDimar/pages/themedimar.css https://cecoldo.dimar.mil.co/datosDimar/themecupertino3.css https://js.arcgis.com https://fonts.googleapis.com/css2 https://js.arcgis.com/4.20/esri/themes/light/main.css https://js.arcgis.com/calcite-components/1.0.0-beta.61/calcite.css https://cecoldo.dimar.mil.co/datosDimar/javax.faces.resource 'unsafe-inline' "/>				 -->
		</h:head>
		<h:form id="form1">
		<input type="hidden" name="csrf" value="true"></input>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>


			<h:form id="formListado">
			<input type="hidden" name="csrf" value="true"></input>
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					rows="10" var="usuario" value="#{usuarioBean.lista}"
					emptyMessage="#{msg['AU.mensaje1']}">
					<p:column headerText="#{msg['AU.mensaje2']}">
						<h:outputText value="#{usuario.persona.tipoDocumentoId.nombre} " />
					</p:column>

					<p:column headerText="#{msg['AU.mensaje3']}">
						<h:outputText value="#{usuario.persona.numeroDocumento} " />
					</p:column>

					<p:column headerText="#{msg['AU.mensaje4']}">
						<h:outputText
							value="#{usuario.persona.primerNombre} #{usuario.persona.segundoNombre} #{usuario.persona.primerApellido} #{usuario.persona.segundoApellido}" />
					</p:column>

					<p:column headerText="#{msg['AU.mensaje5']}">
						<h:outputText value="#{usuario.usuario}" />
					</p:column>


					<p:column headerText="#{msg['AU.mensaje6']}">
						<h:outputText value="#{msg['AU.mensaje14']}" rendered="#{usuario.activo eq 1}" />
						<h:outputText value="#{msg['AU.mensaje15']}" rendered="#{usuario.activo eq 0}" />
					</p:column>

					<p:column headerText="#{msg['AU.mensaje7']}">
						<h:outputText value="#{usuario.usuarioTipo.nombre}" />
					</p:column>





					<p:column headerText="#{msg['AU.mensaje8']}" style="text-align: center">
						<p:commandButton icon="pi pi-pencil" title="Modificar"
							
							disabled="#{usuario.activo eq 0}" 
							action="#{usuarioBean.enviarModificar()}">
							<f:setPropertyActionListener target="#{usuarioBean.usuario}"
								value="#{usuario}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="#{msg['AU.mensaje9']}"
						style="text-align: center">
						<p:commandButton icon="pi pi-check" title="#{msg['AU.mensaje10']}"
							oncomplete="PF('dialogoEliminar').show();"
							disabled="#{usuario.activo eq 1}" update=":formEliminar">
							<f:setPropertyActionListener target="#{usuarioBean.usuario}"
								value="#{usuario}" />
						</p:commandButton>
						<p:commandButton icon="pi pi-times" title="#{msg['AU.mensaje10']}"
							oncomplete="PF('dialogoEliminar').show();"
							disabled="#{usuario.activo eq 0}" update=":formEliminar">
							<f:setPropertyActionListener target="#{usuarioBean.usuario}"
								value="#{usuario}" />
						</p:commandButton>

					</p:column>


				</p:dataTable>

				<p:commandButton id="btn_cr" value="#{msg['AU.mensaje11']}" ajax="false"
					style="width: auto; float: right;"
					action="/pages/administracion/panelUsuario.xhtml?faces-redirect=true">
				</p:commandButton>


			</h:form>




			

			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="#{msg['AU.mensaje12']}"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<h:outputText value="#{msg['AU.mensaje13']}" />
					<br></br>
					<br></br>
					<p:commandButton value="#{msg['AU.mensaje14']}"
						actionListener="#{usuarioBean.eliminarUsuario()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" /> &nbsp; &nbsp; &nbsp;
					<p:commandButton value="#{msg['AU.mensaje15']}" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>


			</h:form>

		</h:body>

	</ui:define>
</ui:composition>
