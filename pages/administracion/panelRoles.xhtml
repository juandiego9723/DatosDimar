<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>
			<script type="text/javascript">
				function handleLoginRequest(xhr, status, args) {
					if (args.validationFailed || !args.loggedIn) {
						jQuery('#form').effect("shake", {
							times : 3
						}, 100);
					} else {
						PF('dlg').hide();
						$('#loginLink').fadeOut();
					}
				}
			</script>
			<h:form id="form">
				<h:messages id="mensaje" autoUpdate="true" />

				<p:panel header="#{msg['panelRol.modRol']}" footer=""
					id="panel">

					<p:panelGrid columns="4" style="width:100%;">
						<p:panelGrid columns="1"
							style="width:80%; margin-left: 10%; background: #c4c4c4; text-align: center;">
							<p:link id="usuario" href="https://cecoldo.dimar.mil.co/datosDimar/pages/tablasReferencia/rol.xhtml">
								<!-- <i class="pi pi-plus-circle" style="font-size: 5rem"></i> -->
								<h:graphicImage><img src="../../images/IRol.svg" width="100" height="100"></img></h:graphicImage>
							</p:link>
							<p:link id="usuariotext" href="https://cecoldo.dimar.mil.co/datosDimar/pages/tablasReferencia/rol.xhtml">

								<p:outputLabel value="#{msg['panelRol.regRol']}" />
							</p:link>
						</p:panelGrid>


						<p:panelGrid columns="1"
							style="width:80%; margin-left: 10%; background: #c4c4c4; text-align: center;">
							<p:link id="roles" href="https://cecoldo.dimar.mil.co/datosDimar/pages/tablasReferencia/usuarioXrol.xhtml">

								<i class="pi pi-sitemap" style="font-size: 5rem"></i>
							</p:link>
							<p:link id="rolestxt" href="https://cecoldo.dimar.mil.co/datosDimar/pages/tablasReferencia/usuarioXrol.xhtml">

								<p:outputLabel value="#{msg['panelRol.adminOpci']}" />
							</p:link>
						</p:panelGrid>








					</p:panelGrid>

				<p:commandButton id="volver_btn" value="#{msg['panelRol.volver']}" styleClass="p-mr-2"
					style="width: auto; float: right;"
					action="#{registrarseBeean.volver}" var="loginBean" />

				</p:panel>


			</h:form>
		</h:body>

	</ui:define>
</ui:composition>
