<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>

			<h:form id="form">
				<h:messages id="mensaje" autoUpdate="true" />
				<p:panelGrid columns="4" style="width: 100%;  float: right;">
					<p:commandButton id="login_btn" value="#{msg['panelUsu.cerrar']}"
						styleClass="p-mr-2" style="width: auto; float: right;"
						action="#{registrarseBeean.cerrarsesion}" var="loginBean" />
				</p:panelGrid>
				<p:panel
					header="#{msg['panelUsu.modUsu']} - #{msg['panelUsu.usuario']} #{panelUsuarioBean.usuarioSeccion} - #{msg['panelUsu.perfil']} #{panelUsuarioBean.usarioRol}"
					footer="" id="panel">

					<p:panelGrid columns="4" style="width:100%;">


						<p:panelGrid columns="1"
							style="width:80%; margin-left: 10%; background: #c4c4c4; text-align: center;">
							<p:link id="usuario"
								href="#{panelAdministracionBean.administracionUsuario}">
								<i class="pi pi-users" style="font-size: 5rem"></i>
							</p:link>
							<p:link id="usuariotext"
								href="#{panelAdministracionBean.administracionUsuario}">

								<p:outputLabel value="#{msg['panelUsu.adminUsu']}" />
							</p:link>
						</p:panelGrid>


						<p:panelGrid columns="1"
							style="width:80%; margin-left: 10%; background: #c4c4c4; text-align: center;">
							<p:link id="roles"
								href="#{panelAdministracionBean.registrarUsuario}">

								<i class="pi pi-user-plus" style="font-size: 5rem"></i>
							</p:link>
							<p:link id="rolestxt"
								href="#{panelAdministracionBean.registrarUsuario}">

								<p:outputLabel value="#{msg['panelUsu.regUsu']}" />
							</p:link>
						</p:panelGrid>



					</p:panelGrid>
					<p:panelGrid columns="4" style="width: 100%;  float: right;">
						
						<p:commandButton id="btn_cr" value="#{msg['panelUsu.volver']}" ajax="false" style="width: auto; float: right;"
							action="/pages/administracion/panelAdministracion.xhtml?faces-redirect=true">
						</p:commandButton>
					</p:panelGrid>
				</p:panel>


			</h:form>
		</h:body>

	</ui:define>
</ui:composition>
