<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio2.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>
			<h:form>
				<p:commandButton value="Agregar Genero"
					actionListener="#{generoBean.limpiarGenero()}"
					oncomplete="PF('dialogoAgregar').show();" update=":formAgregar" />
				<p:separator />
			</h:form>

			<h:form id="formListado">
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					rows="10" var="genero" value="#{generoBean.lista}"
					emptyMessage="No existen registros">
					<p:column headerText="ID">
						<h:outputText value="#{genero.id}" />
					</p:column>
					<p:column headerText="Nombre">
						<h:outputText value="#{genero.nombre}" />
					</p:column>

					<p:column headerText="MODIFICAR" style="text-align: center">
						<p:commandButton icon="ui-icon-pencil" title="Modificar"
							oncomplete="PF('dialogoModificar').show();"
							update=":formModificar">
							<f:setPropertyActionListener target="#{generoBean.genero}"
								value="#{genero}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="ELIMINAR" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
							oncomplete="PF('dialogoEliminar').show();" update=":formEliminar">
							<f:setPropertyActionListener target="#{generoBean.genero}"
								value="#{genero}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</h:form>


			<h:form id="formAgregar">
				<p:dialog id="dlgAgregar" header="Agregar Genero"
					widgetVar="dialogoAgregar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="2" style="margin: 0 auto;">
						<p:outputLabel value="Genero:" />
						<p:inputText value="#{generoBean.genero.nombre}" />
					</p:panelGrid>
					<p:commandButton value="Guardar"
						actionListener="#{generoBean.agregarGenero()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoAgregar').hide();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoAgregar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formModificar">
				<p:dialog id="dlgModificar" header="Modificar Genero"
					widgetVar="dialogoModificar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="2" style="margin: 0 auto;">
						<p:outputLabel value="Genero:" />
						<p:inputText value="#{generoBean.genero.nombre}" />

					</p:panelGrid>
					<p:commandButton value="Guardar"
						actionListener="#{generoBean.modificarGenero()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoModificar').hide();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoModificar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="Eliminar Genero"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<h:outputText value="Desea eliminar este registro?" />
					<p:commandButton value="Si"
						actionListener="#{generoBean.eliminarGenero()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>

		</h:body>

	</ui:define>
</ui:composition>
