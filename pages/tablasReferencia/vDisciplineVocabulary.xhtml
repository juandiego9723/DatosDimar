<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>
			<h:form>
				<p:commandButton value="Agregar disciplineVocabulary"
					actionListener="#{vDisciplineVocabularyBean.limpiarV_DisciplinaVocabulario()}"
					oncomplete="PF('dialogoAgregar').show();" update=":formAgregar" />
				<p:separator />
			</h:form>

			<h:form id="formListado">
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					rows="10" var="disciplineVocabulary"
					value="#{vDisciplineVocabularyBean.lista}"
					emptyMessage="No existen registros">
					<p:column headerText="ID">
						<h:outputText value="#{disciplineVocabulary.id}" />
					</p:column>
					<p:column headerText="Disciplina">
						<h:outputText value="#{disciplineVocabulary.name_Disci}" />
					</p:column>
					<p:column headerText="Vocabulario">
						<h:outputText value="#{disciplineVocabulary.name_Voca}" />
					</p:column>

					<p:column headerText="MODIFICAR" style="text-align: center">
						<p:commandButton icon="ui-icon-pencil" title="Modificar"
							oncomplete="PF('dialogoModificar').show();"
							update=":formModificar">
							<f:setPropertyActionListener
								target="#{vDisciplineVocabularyBean.v_DisciplinaVocabulario}"
								value="#{v_DisciplinaVocabulario}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="ELIMINAR" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="Eliminar"
							oncomplete="PF('dialogoEliminar').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{vDisciplineVocabularyBean.v_DisciplinaVocabulario}"
								value="#{v_DisciplinaVocabulario}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
				<h:panelGrid id="containerGrid" columns="1" cellpadding="10"
					width="100%">
					<p:panelGrid columns="2" cellpadding="10" style="float: right;">
						<p:commandButton id="btn_cr" value="Volver" ajax="false"
							action="/pages/administracion/panelArcmarine.xhtml?faces-redirect=true">
						</p:commandButton>
					</p:panelGrid>
				</h:panelGrid>
			</h:form>


			<h:form id="formAgregar">
				<p:dialog id="dlgAgregar" header="Agregar disciplineVocabulary"
					widgetVar="dialogoAgregar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="2" style="margin: 0 auto;">
						<p:outputLabel value="Disciplina:" />
						<p:selectOneMenu value="#{vDisciplineVocabularyBean.seldiciplina}"
							converter="omnifaces.SelectItemsConverter" id="seldiciplina">
							<f:selectItem itemLabel="Seleccione..." itemValue="" />
							<f:selectItems
								value="#{vDisciplineVocabularyBean.listadiscipline}"
								var="seldiciplina" itemLabel="#{seldiciplina.name}"
								itemValue="#{seldiciplina}" />
						</p:selectOneMenu>
						<p:outputLabel value="Vocabulario:" />
						<p:selectOneMenu value="#{vDisciplineVocabularyBean.vocabylary}"
							converter="omnifaces.SelectItemsConverter" id="vocabylary">
							<f:selectItem itemLabel="Seleccione..." itemValue="" />
							<f:selectItems
								value="#{vDisciplineVocabularyBean.listavocabulary}"
								var="vocabylary" itemLabel="#{vocabylary.name}"
								itemValue="#{vocabylary}" />
						</p:selectOneMenu>
					</p:panelGrid>
					<p:commandButton value="Guardar"
						actionListener="#{vDisciplineVocabularyBean.agregarV_DisciplinaVocabulario()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoAgregar').hide();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoAgregar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formModificar">
				<p:dialog id="dlgModificar" header="Modificar disciplineVocabulary"
					widgetVar="dialogoModificar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="2" style="margin: 0 auto;">
						<p:outputLabel value="Disciplina:" />
						<p:selectOneMenu value="#{vDisciplineVocabularyBean.seldiciplina}"
							converter="omnifaces.SelectItemsConverter" id="seldiciplina1">
							<f:selectItem itemLabel="Seleccione..." itemValue="" />
							<f:selectItems
								value="#{vDisciplineVocabularyBean.listadiscipline}"
								var="seldiciplina" itemLabel="#{seldiciplina.name}"
								itemValue="#{seldiciplina}" />
						</p:selectOneMenu>
						<p:outputLabel value="Vocabulario:" />
						<p:selectOneMenu value="#{vDisciplineVocabularyBean.vocabylary}"
							converter="omnifaces.SelectItemsConverter" id="vocabylary1">
							<f:selectItem itemLabel="Seleccione..." itemValue="" />
							<f:selectItems
								value="#{vDisciplineVocabularyBean.listavocabulary}"
								var="vocabylary" itemLabel="#{vocabylary.name}"
								itemValue="#{vocabylary}" />
						</p:selectOneMenu>

					</p:panelGrid>
					<p:commandButton value="Guardar"
						actionListener="#{vDisciplineVocabularyBean.modificarV_DisciplinaVocabulario()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoModificar').hide();" />
					<p:commandButton value="Cancelar"
						onclick="PF('dialogoModificar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="Eliminar disciplineVocabulary"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<h:outputText value="Desea eliminar este registro?" />
					<p:commandButton value="Si"
						actionListener="#{vDisciplineVocabularyBean.eliminarV_DisciplinaVocabulario()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>

		</h:body>

	</ui:define>
</ui:composition>
