<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>


			<h:form id="formListado">
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					rows="10" var="usuarioXrol" value="#{usuarioBean.listaUsuarioXrol}"
					emptyMessage="#{msg['AU.mensaje1']}">

					<p:column headerText="#{msg['AU.mensaje4']}">
						<h:outputText value="#{usuarioXrol.usuarioId.persona.primerNombre  } #{ usuarioXrol.usuarioId.persona.segundoNombre} #{ usuarioXrol.usuarioId.persona.primerApellido} #{ usuarioXrol.usuarioId.persona.segundoApellido}" />
					</p:column>
					<p:column headerText="#{msg['AU.mensaje5']}">
						<h:outputText value="#{usuarioXrol.usuarioId.usuario}" />
					</p:column>
					<p:column headerText="#{msg['UXR.mensaje1']}">
						<h:outputText value="#{usuarioXrol.rolId.nombre}" />
					</p:column>
					
					<p:column headerText="#{msg['RG.mensaje15']}">
						<h:outputText value="#{usuarioXrol.usuarioId.usuarioTipo.nombre}" />
					</p:column>



					<p:column headerText="#{msg['AU.mensaje8']}" style="text-align: center">
						<p:commandButton icon="pi pi-pencil" title="#{msg['AU.mensaje8']}"

							action="#{usuarioBean.enviarModificarUsuarioXrol()}">
							<f:setPropertyActionListener target="#{usuarioBean.usuarioXRol}"
								value="#{usuarioXrol}" />
						</p:commandButton>
					</p:column>
					


				</p:dataTable>

				<p:commandButton id="btn_cr" value="#{msg['AU.mensaje11']}" ajax="false"
					style="width: auto; float: right;"
					action="/pages/administracion/panelRoles.xhtml?faces-redirect=true">
				</p:commandButton>


			</h:form>






			

		</h:body>

	</ui:define>
</ui:composition>
