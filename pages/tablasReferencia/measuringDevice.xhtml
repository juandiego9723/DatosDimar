<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
			<meta charset="utf-8" name="viewport"
				content="width=device-width, initial-scale=1"
				http-equiv="X-UA-Conpatible" />
		</h:head>
		<h:form id="form1">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>
			<h:form>
				<p:commandButton value="#{msg['M.mensaje1']}"
					actionListener="#{measuringdeviceBean.limpiarMeasuringdevice()}"
					oncomplete="PF('dialogoAgregar').show();" update=":formAgregar" />
				<p:separator />
			</h:form>

			<h:form id="formListado">
				<p:dataTable id="tabla" paginator="true" paginatorPosition="bottom"
					rows="10" var="measuringdevice"
					value="#{measuringdeviceBean.lista}"
					emptyMessage="#{msg['AU.mensaje1']}">
					<p:column headerText="ID">
						<h:outputText value="#{measuringdevice.deviceID}" />
					</p:column>
					<p:column headerText="#{msg['R.mensaje5']}">
						<h:outputText value="#{measuringdevice.name}" />
					</p:column>
					<p:column headerText="#{msg['C.mensaje3']}">
						<h:outputText value="#{measuringdevice.description}" />
					</p:column>
					<p:column headerText="#{msg['M.mensaje2']}">
						<h:outputText value="#{measuringdevice.vehicleID.name}" />
					</p:column>

					<p:column headerText="#{msg['AU.mensaje8']}" style="text-align: center">
						<p:commandButton icon="ui-icon-pencil" title="#{msg['AU.mensaje8']}"
							oncomplete="PF('dialogoModificar').show();"
							update=":formModificar">
							<f:setPropertyActionListener
								target="#{measuringdeviceBean.measuringdevice}"
								value="#{measuringdevice}" />
						</p:commandButton>
					</p:column>
					<p:column headerText="#{msg['AU.mensaje10']}" style="text-align: center">
						<p:commandButton icon="ui-icon-trash" title="#{msg['AU.mensaje10']}"
							oncomplete="PF('dialogoEliminar').show();" update=":formEliminar">
							<f:setPropertyActionListener
								target="#{measuringdeviceBean.measuringdevice}"
								value="#{measuringdevice}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
				<h:panelGrid id="containerGrid" columns="1" cellpadding="10"
					width="100%">
					<p:panelGrid columns="2" cellpadding="10" style="float: right;">
						<p:commandButton id="btn_cr" value="#{msg['AU.mensaje11']}" ajax="false"
							action="/pages/administracion/panelArcmarine.xhtml?faces-redirect=true">
						</p:commandButton>
					</p:panelGrid>
				</h:panelGrid>
			</h:form>


			<h:form id="formAgregar">
				<p:dialog id="dlgAgregar" header="#{msg['M.mensaje1']}"
					widgetVar="dialogoAgregar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="2" style="margin: 0 auto;">
						<p:outputLabel value="measuringdevice ID:" />
						<p:inputNumber
							value="#{measuringdeviceBean.measuringdevice.deviceID}" />
						<p:outputLabel value="#{msg['R.mensaje5']}:" />
						<p:inputText value="#{measuringdeviceBean.measuringdevice.name}" />
						<p:outputLabel value="#{msg['C.mensaje3']}:" />
						<p:inputText
							value="#{measuringdeviceBean.measuringdevice.description}" />
						<p:outputLabel value="#{msg['M.mensaje2']}:" />
						<p:selectOneMenu value="#{measuringdeviceBean.vehicle}"
							converter="omnifaces.SelectItemsConverter" id="vehicle">
							<f:selectItem itemLabel="#{msg['SE.mensaje13']}" itemValue="" />
							<f:selectItems value="#{measuringdeviceBean.listalistavehicle}"
								var="vehicle" itemLabel="#{vehicle.name}" itemValue="#{vehicle}" />
						</p:selectOneMenu>
					</p:panelGrid>
					<p:commandButton value="#{msg['R.mensaje2']}"
						actionListener="#{measuringdeviceBean.agregarMeasuringdevice()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoAgregar').hide();" />
					<p:commandButton value="#{msg['SE.mensaje45']}"
						onclick="PF('dialogoAgregar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formModificar">
				<p:dialog id="dlgModificar" header="#{msg['M.mensaje3']}"
					widgetVar="dialogoModificar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<p:panelGrid columns="2" style="margin: 0 auto;">
						<p:outputLabel value="measuringdevice ID:" />
						<p:inputNumber
							value="#{measuringdeviceBean.measuringdevice.deviceID}" />
						<p:outputLabel value="#{msg['R.mensaje5']}:" />
						<p:inputText value="#{measuringdeviceBean.measuringdevice.name}" />
						<p:outputLabel value="#{msg['C.mensaje3']}:" />
						<p:inputText
							value="#{measuringdeviceBean.measuringdevice.description}" />
						<p:outputLabel value="#{msg['M.mensaje2']}:" />
						<p:selectOneMenu value="#{measuringdeviceBean.vehicle}"
							converter="omnifaces.SelectItemsConverter" id="vehicle">
							<f:selectItem itemLabel="#{msg['SE.mensaje13']}" itemValue="" />
							<f:selectItems value="#{measuringdeviceBean.listalistavehicle}"
								var="vehicle" itemLabel="#{vehicle.name}" itemValue="#{vehicle}" />
						</p:selectOneMenu>
					</p:panelGrid>
					<p:commandButton value="#{msg['R.mensaje2']}"
						actionListener="#{measuringdeviceBean.modificarMeasuringdevice()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoModificar').hide();" />
					<p:commandButton value="#{msg['SE.mensaje45']}"
						onclick="PF('dialogoModificar').hide();" />
				</p:dialog>
			</h:form>

			<h:form id="formEliminar">
				<p:dialog id="dlgEliminar" header="#{msg['M.mensaje4']}"
					widgetVar="dialogoEliminar" resizable="false" showEffect="fade"
					hideEffect="explode" modal="true">
					<h:outputText value="#{msg['R.mensaje7']}" />
					<p:commandButton value="#{msg['AU.mensaje14']}"
						actionListener="#{measuringdeviceBean.eliminarMeasuringdevice()}"
						update=":formListado:tabla"
						oncomplete="PF('dialogoEliminar').hide();" />
					<p:commandButton value="No" onclick="PF('dialogoEliminar').hide();" />
				</p:dialog>
			</h:form>

		</h:body>

	</ui:define>
</ui:composition>
