<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<h:head>
<!-- 		<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->

	</h:head>
	<ui:define name="body">
		<h:form>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:form id="form">
			<p:panel style="width:99%; height:100%;"
				header="Maestro de Tablas de Referencia">
				<div align="center">

					<h:panelGrid columns="1" cellspacing="20" border="1">
						<f:facet name="header">
							<h:outputText value="Seleccione una tabla de Referencia"></h:outputText>
						</f:facet>
						<p:selectOneMenu id="tablas" value="#{tablaReferenciaBean.tablas}">
							<f:selectItems value="#{tablaReferenciaBean.tablas}" var="tab"
								itemLabel="#{tab.tabla}" itemValue="#{tab.id}" />
						</p:selectOneMenu>
					</h:panelGrid>
					<h:panelGrid columns="2" cellspacing="20" border="1">

						<h:outputText value="Nombres"></h:outputText>
						<h:inputText value="#{agregacionTemporal.nombre}"></h:inputText>

						<f:facet name="footer">
							<h:commandButton
								action="#{agregacionTemporalBean.guardar(agregacionTemporal)}"
								immediate="true" value="Guardar"></h:commandButton>
						</f:facet>
						<f:facet name="footer">
							<h:commandButton
								action="#{agregacionTemporalBean.actualizar(agregacionTemporal)}"
								value="Actualizar"></h:commandButton>
						</f:facet>

					</h:panelGrid>
					<h:dataTable
						value="#{agregacionTemporalBean.obtenerAgregacionTemporal()}"
						var="agregacionTemporal" border="1">
						<h:column>
							<f:facet name="header">Id</f:facet>
							<h:outputText value="#{agregacionTemporal.id}"></h:outputText>
						</h:column>
						<h:column>
							<f:facet name="header">Valor Tabla</f:facet>
							<h:outputText value="#{agregacionTemporal.nombre}"></h:outputText>
						</h:column>
						<h:column>
							<f:facet name="header">Editar</f:facet>
							<h:commandButton
								action="#{agregacionTemporalBean.editar(agregacionTemporal.id)}"
								immediate="true" value="Editar"></h:commandButton>
						</h:column>
						<h:column>
							<f:facet name="header">Eliminar</f:facet>
							<h:commandButton
								action="#{agregacionTemporalBean.eliminar(agregacionTemporal.id)}"
								immediate="true" value="Eliminar"></h:commandButton>
						</h:column>
					</h:dataTable>
				</div>
			</p:panel>
		</h:form>

	</ui:define>
</ui:composition>
