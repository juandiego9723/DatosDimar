<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio.xhtml">
	<ui:define name="body">

		<h:head>
<!-- 			<link href="/resources/theme.css" rel="stylesheet" type="text/css" /> -->
		</h:head>
		<h:form id="form">
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>

			<h:messages id="mensaje" autoUpdate="true" />
			<p:panel header="#{bienvenida.bienvenida}" style=" width: 60%;"
				id="panelResgistrase">
				<p:row id="my-row-id" styleClass="my-heading-row"
					style="font-weight: bold">
            <p:outputLabel value="#{msg['regis.llenarCampos']}"></p:outputLabel> <br></br>
				</p:row>
				<br></br>



				<h:form id="form1">

					<p:panel header="#{msg['regis.datPer']}" style=" width: 95%;">
						<p:panelGrid columns="2" id="panelpersona"
							styleClass="ui-panelgrid-blank ui-fluid,panelGridCenter"
							style=" background-color:transparent;">

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="tipodoc" value="#{msg['regis.tipoIdent']}" />
								<br></br>
								<p:selectOneMenu id="tipodoc"
									value="#{registrarseBeean.tipoDocumento.id}"
									style="width:100%;" required="true">
									<f:selectItem itemLabel="#{msg['RG.mensaje3']}"
										itemValue="" noSelectionOption="true" />
									<f:selectItems value="#{registrarseBeean.listaTipoDocumento}"
										var="g" itemLabel="#{g.nombre}" itemValue="#{g.id}" />
								</p:selectOneMenu>
								<h:messages for="tipodoc" />
							</h:panelGrid>



							<h:panelGrid style=" width:100%;  ">
								<p:outputLabel for="cedula" value="#{msg['regis.selecTipoPer']}" />
								<br></br>
								<p:inputText id="cedula" style="width:100%;"
									value="#{registrarseBeean.persona.numeroDocumento}"
									required="true" />
								<h:messages for="cedula" />
							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="nombre1" value="#{msg['regis.primerNombre']}" />
								<br></br>
								<p:inputText id="nombre1"
									value="#{registrarseBeean.persona.primerNombre}"
									required="true" style="width:100%;" />
								<h:messages for="nombre1" />
							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="nombre2" value="#{msg['regis.segundoNombre']}" />
								<br></br>
								<p:inputText id="nombre2"
									value="#{registrarseBeean.persona.segundoNombre}"
									required="false" style="width:100%;" />
								<h:messages for="nombre2" />
							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="apellido1" value="#{msg['regis.primerApellido']}"
									style="width:100%;" />
								<br></br>
								<p:inputText id="apellido1"
									value="#{registrarseBeean.persona.primerApellido}"
									required="true" style="width:100%;" />
								<h:messages for="apellido1" />

							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="apellido2" value="#{msg['regis.segundoApellido']}"
									style="width:100%;" />
								<br></br>
								<p:inputText id="apellido2"
									value="#{registrarseBeean.persona.segundoApellido}"
									required="false" style="width:100%;" />
								<h:messages for="apellido2" />
							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="correo" value="#{msg['regis.correo']}" />
								<br></br>
								<p:inputText id="correo"
									value="#{registrarseBeean.persona.correoElectronico}"
									required="true" style="width:100%;" />
							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel for="rol" value="Rol" />
								<br></br>
								<p:selectOneMenu id="rol"
									value="#{registrarseBeean.rol.id}"
									style="width:100%;" required="true">
									<f:selectItem itemLabel="#{msg['RG.mensaje20']}" itemValue=""
										noSelectionOption="true" />
									<f:selectItems value="#{rolBean.lista}" var="g"
										itemLabel="#{g.nombre}" itemValue="#{g.id}" />
								</p:selectOneMenu>
								<h:messages for="rol" />
							</h:panelGrid>
							
							<h:panelGrid style=" width:100%;  ">
								<p:outputLabel for="cargo" value="#{msg['RG.mensaje11']}" />
								<br></br>
								<p:inputText id="cargo" style="width:100%;"
									
									required="true" />
								<h:messages for="cargo" />
							</h:panelGrid>

						</p:panelGrid>
					</p:panel>

					<p:panel header="#{msg['RG.mensaje12']}" style=" width: 80%;">
						<p:panelGrid columns="2" id="panelUsuario"
							styleClass="ui-panelgrid-blank ui-fluid,panelGridCenter"
							style=" background-color:transparent;">
							<h:panelGrid style=" width:100%;">

								<p:outputLabel value="#{msg['panelUsu.usuario']}" />
								<br></br>
								<p:inputText id="username"
									value="#{registrarseBeean.usuario.usuario}" style="width:100%;"
									required="true" />
								<h:messages for="username" />
							</h:panelGrid>
							<h:panelGrid style=" width:100%;">

								<p:outputLabel for="password" value="#{msg['RG.mensaje14']}" />
								<br></br>
								<p:password id="password"
									value="#{registrarseBeean.usuario.password}" match="password2"
									feedback="true" validatorMessage="#{msg['regis.m4contrasena']}"
									weakLabel="#{msg['regis.m1contrasena']}" strongLabel="#{msg['regis.m3contrasena']}" goodLabel="#{msg['regis.m2contrasena']}"
									required="true" promptLabel="#{msg['regis.mcontrasena']}"
									style="width:100%;" />
								<h:messages for="password" />
							</h:panelGrid>
							<h:panelGrid style=" width:100%;">

								<p:outputLabel for="password2" value="#{msg['regis.contrasena2']}" />
								<br></br>
								<p:password id="password2" style="width:100%;" required="true" />
								<h:messages for="password2" />
							</h:panelGrid>

							<h:panelGrid style=" width:100%;">
								<p:outputLabel value="#{msg['RG.mensaje15']}" />
								<br></br>
								<p:selectOneMenu id="tipousu"
									value="#{registrarseBeean.usuarioTipo.id}" style="width:100%;"
									disabled="true">

									<f:selectItem itemLabel="#{msg['RG.mensaje16']}" itemValue="1" />
								</p:selectOneMenu>
							</h:panelGrid>




						</p:panelGrid>
					</p:panel>
					<p:row>
						<p:column styleClass="ui-grid-col-12">
							<center>
								<p:commandButton id="login_btn" value="#{msg['RG.mensaje17']}"
									styleClass="p-mr-2" style="width: auto"
									action="#{registrarseBeean.enviarint}" var="loginBean"
									update="panelResgistrase" />
								&nbsp; &nbsp; &nbsp;
								<p:commandButton id="cancelar_btn" value="#{msg['SE.mensaje45']}"
									action="#{registrarseBeean.cancelar}" />




							</center>
						</p:column>

					</p:row>
				</h:form>
			</p:panel>










		</h:body>

	</ui:define>
</ui:composition>
