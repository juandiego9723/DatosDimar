<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/template/templateInicio2.xhtml">
	<ui:define name="body">
		<style type="text/css">
			body { background: linear-gradient(135deg, #e8f0f9 0%, #f7fafd 100%) !important; }
			.panellogin1 { width: 420px; margin: 0 auto; border: none !important; border-radius: 14px !important;
				box-shadow: 0 10px 35px rgba(10,50,100,.18); overflow: hidden; background: #fff !important; }
			.panellogin1 .ui-panel-titlebar { background: linear-gradient(90deg, #0b4a8f, #1a73c9) !important;
				color: #fff !important; border: none !important; text-align: center; padding: 16px !important;
				font-size: 15px; font-weight: 600; }
			.panellogin1 .ui-panel-content { padding: 22px 28px !important; }
			.panelgridlogin, .panelgridlogin tr, .panelgridlogin td { border: none !important; background: transparent !important; }
			.panelgridlogin td { padding: 8px 6px !important; }
			.panellogin1 input[type=text], .panellogin1 input[type=password] { width: 100%; box-sizing: border-box;
				padding: 10px 12px !important; border: 1px solid #c5d3e3 !important; border-radius: 8px !important;
				transition: border-color .2s, box-shadow .2s; }
			.panellogin1 input:focus { border-color: #1a73c9 !important; box-shadow: 0 0 0 3px rgba(26,115,201,.2) !important; outline: none; }
			.panellogin1 .ui-button { background: #1a73c9 !important; color: #fff !important; border: none !important;
				border-radius: 8px !important; padding: 9px 26px !important; transition: transform .15s, background .2s; }
			.panellogin1 .ui-button:hover { background: #0b4a8f !important; transform: translateY(-1px); }
			.panellogin1 a { color: #1a73c9; text-decoration: none; }
			.panellogin1 a:hover { text-decoration: underline; }
		</style>

		<h:form  requireSSL="true" id="form1" transient = "true" autocomplete="off">
		<input type="hidden" name="csrf" value="true"></input>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
		</h:form>
		<h:body>
		<img src="https://pagos.dimar.mil.co/images/Ajustes_avisos_GRUINSER-02.jpg"
		style="position:fixed;top:10%;left:10%;width:80%;z-index:9999;cursor:pointer;"
		onclick="this.style.display='none'"/>
		<img src="https://pagos.dimar.mil.co/images/devoluciones.png"
		style="position:fixed;top:10%;left:10%;width:80%;z-index:9998;cursor:pointer;"
		onclick="this.style.display='none'"/>
			<br></br>
			<br></br>
			<br></br>
			<h:form requireSSL="true" id="formxxx" transient = "true" autocomplete="off">
			<input type="hidden" name="csrf" value="true"></input>
				<p:panel styleClass="panellogin1" header="#{msg['login.titulo']}" 
					id="panelLogin">
					<p:messages id="statusMessages" />
					<p:panelGrid  styleClass="panelgridlogin" columns="2">
						<p:outputLabel for="username" value="#{msg['login.usuario']}" />
						<h:panelGroup>
							<p:inputText id="username" value="#{loginBean.usuario.usuario}"
								required="true" autocomplete="off" />
							<p:tooltip for="username" value="#{msg['login.msg_usuario']}"
								position="top" />
							<p:message for="username" />
						</h:panelGroup>

						<p:outputLabel for="password" value="#{msg['login.clave']}" />
						<h:panelGroup>
							<p:password id="password" value="#{loginBean.usuario.password}"
								required="true" autocomplete="off" />
							<p:tooltip for="password" value="#{msg['login.msg_clave']}"
								position="top" />
							<p:message for="password" />
						</h:panelGroup>
					</p:panelGrid>
					<p:panelGrid styleClass="panelgridlogin" columns="1">
						<p:row>
							<div align="center">						
								<p:captcha theme="white" language="sp" required="true"
									id="captcha"
									requiredMessage="Por favor digite las palabras de verificación"
									validatorMessage="Error: Las palabras de verificacón no concuerdan"></p:captcha>
								<!-- 								<p:messages for="captcha" /> -->
							</div>
						</p:row>
						<p:row>
							<p:column class="ui-grid-col-12">
								<center>
									<p:commandButton id="login_btn" value="#{msg['login.login']}"
										styleClass="p-mr-2"  
										action="#{loginBean.login}" var="loginBean" 
										update="panelLogin" />
									&nbsp; &nbsp; &nbsp;

									<p:commandButton id="cancel_btn" value="#{msg['login.cancel']}"
										action="#{loginBean.cancelar}" var="loginBean" type="submit"
										process="@this" />
									<br></br> <br></br>
									<p:link id="registrar" outcome="registrar" value="#{msg['login.register']}"></p:link>
									<br></br> <br></br>
									<p:link id="contrasena" outcome="contrasena" value="#{msg['login.forgPass']}"></p:link>
								</center>
							</p:column>
						</p:row>
						<p:row>
						<p:column class="ui-grid-col-12">
						 <center>
						<p:outputLabel  value="Ver. 3.11" />
							</center>
							</p:column>
						</p:row>
					</p:panelGrid>				
				</p:panel>

<!-- 					<ui:include src="/pages/template/piePagina.xhtml" /> -->
<!-- 				</div> -->
<!-- 			</footer> -->
<!-- 		</div> -->
		
			</h:form>

		</h:body>
	</ui:define>
</ui:composition>
